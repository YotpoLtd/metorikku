name: Publish Spark 3.5.8 Metorikku Image to ECR

# Manually re-builds and publishes the self-contained Spark 3.5.8 / Delta 3.1.0
# Metorikku image (docker/metorikku-spark35/Dockerfile.metorikku-spark35) to ECR
# under a FIXED tag. The image is built entirely from this repo (stage 1 runs
# `sbt assembly` to produce metorikku.jar; stage 2 layers it onto
# apache/spark:3.5.8 with Delta + hadoop-aws) and is consumed as a base by
# downstream Spark jobs. The tag is intentionally hardcoded so it always matches
# the image those deployments reference and cannot drift (KOALA-2492).
on:
  workflow_dispatch: # Manual trigger only, from the Actions tab

concurrency:
  group: ${{ github.ref }}-publish-spark358
  cancel-in-progress: true

permissions: # Assume AWS permissions
  id-token: write
  contents: read

env:
  AWS_ECR_PREFIX: 402837048690.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: spark-3.5.8-delta-3.1.0
  DOCKERFILE: docker/metorikku-spark35/Dockerfile.metorikku-spark35

jobs:
  publish-spark358-to-ecr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: YotpoLtd/github-actions-permissions/.github/actions/aws_credentials@master

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get Image Name
        run: |
          BASE_PROJECT_NAME=$(basename "${{ github.workspace }}")
          echo "IMAGE=${{ env.AWS_ECR_PREFIX }}/${BASE_PROJECT_NAME}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV
        shell: bash

      - name: Build image
        run: |
          docker build \
            -f "${{ env.DOCKERFILE }}" \
            -t "${{ env.IMAGE }}" \
            .

      - name: Verify metorikku.jar + Spark 3.5.8 + Delta 3.1.0 (blocks push on mismatch)
        run: |
          docker run --rm --entrypoint bash "${{ env.IMAGE }}" -c '
          set -e
          echo "=== metorikku.jar (mainApplicationFile target) ==="
          test -f /opt/metorikku/metorikku.jar || { echo "FAIL: /opt/metorikku/metorikku.jar missing"; exit 1; }
          ls -l /opt/metorikku/metorikku.jar
          echo "=== Spark version ==="
          /opt/spark/bin/spark-submit --version 2>&1 | grep -q "version 3.5.8" || { echo "FAIL: Spark is not 3.5.8"; exit 1; }
          echo "=== Delta 3.1.0 jars ==="
          ls /opt/spark/jars/delta-spark_2.12-3.1.0.jar /opt/spark/jars/delta-storage-3.1.0.jar >/dev/null || { echo "FAIL: delta 3.1.0 jars missing"; exit 1; }
          echo "=== hadoop-aws + aws-java-sdk-bundle ==="
          ls /opt/spark/jars/hadoop-aws-3.3.4.jar /opt/spark/jars/aws-java-sdk-bundle-*.jar >/dev/null || { echo "FAIL: hadoop-aws / aws sdk missing"; exit 1; }
          echo "VERSION CHECK: PASS"'

      - name: Push to ECR
        run: docker push "${{ env.IMAGE }}"
